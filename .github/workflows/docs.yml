name: Deploy Documentation

on:
  push:
    branches:
      - main
      - feat-auto-20260829-be5cc9f5
    paths:
      - 'website/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The website has its own package.json + package-lock.json. We use
      # Bun here (consistent with the monorepo CI migration) but read the
      # npm lockfile via `bun install --frozen-lockfile`. The Docusaurus
      # build itself is plain Node-style webpack and runs under `bun run`.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: website
        run: bun install --frozen-lockfile

      - name: Build Docusaurus site
        working-directory: website
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bun run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
